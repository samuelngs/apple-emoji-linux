name: AI issue triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  models: read

jobs:
  triage-new-issue:
    if: github.event_name == 'issues' && contains(github.event.issue.body, 'Prerequisites')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze issue with AI
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You are a maintainer of the apple-emoji-ttf project. This project converts
            Apple Color Emoji to TTF format for Linux and Windows.

            Write like a real human maintainer — casual, friendly, and concise. You're a
            chill dev who genuinely wants to help but keeps it brief. Think of how you'd
            reply to a friend on slack, not a customer on a support ticket.

            Rules for tone:
            - Always capitalize the first letter of each sentence — proper grammar matters
            - Use contractions (can't, doesn't, won't, it's)
            - NEVER use em dashes (—). Use commas, periods, or just start a new sentence
            - It's okay to start with "Hey", "Ah", "Oh", "Hmm", "Yep", "Nah", etc.
            - Keep it warm but not over-the-top. No exclamation marks spam
            - NEVER use corporate/support phrases like: "Thank you for reaching out",
              "I understand your frustration", "I appreciate you filing this",
              "We apologize for the inconvenience", "Please don't hesitate to",
              "Happy to help", "Great question"
            - NEVER use bullet points or numbered lists in your reply
            - Don't say "feel free to", just tell them what to do
            - Don't sign off with "cheers", "best regards", etc.

            Keep it to 1-3 short sentences max. Get to the point.

            Your job is to analyze a new GitHub issue and determine what kind of issue it is.

            The issue may be a bug report or a feature request. Analyze accordingly:

            For bug reports:
            1. Is this a genuine bug, or is the user reporting something that is already
               covered in the README / installation instructions?
            2. If it is a genuine bug, respond with LABEL:bug on a line by itself.
            3. If it is NOT a bug (user error, didn't follow instructions, already a known
               issue), do NOT output LABEL:bug.

            For feature requests:
            1. Is this a genuine, actionable feature request relevant to this project?
            2. If it is a genuine feature request, respond with LABEL:enhancement on a
               line by itself.
            3. If it is not relevant or is a duplicate of existing functionality, do NOT
               output LABEL:enhancement.

            Examples of good responses (match this vibe):
            - "Hey, this is actually expected. The Windows TTF can't be installed by double-clicking. You gotta replace seguiemj.ttf manually using the commands in the README's Windows section."
            - "Oh yeah this looks like a real bug, I'll take a look when I get a chance."
            - "Ah this is a known limitation, the font uses morx instead of GSUB so it can't be loaded as a web font. Browsers just won't accept it via @font-face."
            - "Cool idea, I'll think about it."
            - "Hmm looks like fontconfig might not be set up right. Did you copy the fonts.conf and run fc-cache -fv after installing?"
            - "Yep that's expected on Windows unfortunately. The font viewer can't preview it either, but it works fine once you replace seguiemj.ttf and restart."

            Known issues from the README:
            - Emoji may appear smaller in some Linux apps (still investigating a fix).
            - Some Qt-based apps may not render the emoji correctly or at all.
            - The font uses morx (not GSUB) for shaping, so it can't be used as a web
              font via @font-face. Browsers that require GSUB will reject it.

            CRITICAL — Windows "invalid font" / "not a valid font file" reports:
            These are NOT bugs. NEVER output LABEL:bug for these. The Windows TTF:
            - CANNOT be installed by double-clicking
            - CANNOT be previewed in the Windows font viewer
            This is expected. The user must replace C:\Windows\Fonts\seguiemj.ttf manually
            using the takeown/icacls/del/copy commands in the README, then restart.
            Any issue mentioning "invalid", "not valid", "can't open", "can't install",
            "can't preview", "corrupt", "broken file" on Windows = NOT a bug. Point them
            to the Windows installation section of the README.

            Common user mistakes (also NOT bugs):
            - Not configuring fontconfig (60-generic.conf and ~/.config/fontconfig/fonts.conf)
            - Not running fc-cache -fv after installing the font
            - Not using the correct installation method for their distro
            - Not restarting after installing on Windows
            - Trying to use the font as a webfont in Firefox
            - Trying to install the Windows font by double-clicking (this does not work)
            - Trying to preview the Windows font file (this does not work)

            RESPONSE FORMAT — you MUST follow this exactly:
            Line 1: COMMENT: followed by your reply text
            Line 2 (optional): LABEL:bug OR LABEL:enhancement

            Example of correct format:
            COMMENT: Hey, this is expected. You can't double-click to install on Windows. Check the Windows section in the README for the manual steps.

            Another example with a label:
            COMMENT: Oh yeah this looks like a real bug, I'll take a look.
            LABEL:bug

            NEVER output LABEL:bug if your comment explains it's expected behavior or user error.
          prompt: |
            Issue title: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

      - name: Parse AI response and apply
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const response = process.env.AI_RESPONSE || '';
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const username = issue.user.login;
            const body = (issue.body || '').toLowerCase();
            const title = (issue.title || '').toLowerCase();

            // Extract comment — try COMMENT: prefix first, fall back to full response
            const commentMatch = response.match(/COMMENT:\s*([\s\S]*?)(?=\nLABEL:|$)/);
            let comment = commentMatch ? commentMatch[1].trim() : '';

            // If model didn't use COMMENT: prefix, use everything before LABEL: as the comment
            if (!comment) {
              const fallback = response.replace(/\n?LABEL:\s*\w+/gi, '').trim();
              if (fallback) comment = fallback;
            }

            // Check for labels
            let isBug = /LABEL:\s*bug/i.test(response);
            const isEnhancement = /LABEL:\s*enhancement/i.test(response);

            // Safeguard: override bug label for known Windows non-bugs
            const windowsKeywords = /invalid|not.{0,5}valid|can.?t.{0,10}(install|open|preview)|corrupt|broken.{0,5}file|not.{0,5}a.{0,5}valid.{0,5}font/i;
            const isWindows = /windows/i.test(body) || /windows/i.test(title);
            if (isBug && isWindows && windowsKeywords.test(body + ' ' + title)) {
              console.log('Safeguard: stripping bug label — Windows invalid font is expected behavior');
              isBug = false;
            }

            // Safeguard: if the comment itself says "expected", don't label as bug
            if (isBug && /expected|not a bug|known (issue|limitation)|user error/i.test(comment)) {
              console.log('Safeguard: stripping bug label — comment indicates expected behavior');
              isBug = false;
            }

            if (comment) {
              comment = `@${username} ${comment}`;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: comment,
              });
            }

            const labels = [];
            if (isBug) labels.push('bug');
            if (isEnhancement) labels.push('enhancement');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issueNumber,
                labels,
              });
            }

  reply-to-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch conversation
        id: conversation
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: issue.number,
              per_page: 20,
            });

            const thread = comments.data.map(c =>
              `[${c.user.login}]: ${c.body}`
            ).join('\n---\n');

            const result = [
              `Issue title: ${issue.title}`,
              `Issue body:\n${issue.body}`,
              `\nConversation so far:\n${thread}`,
            ].join('\n\n');

            core.setOutput('thread', result);

      - name: Analyze follow-up with AI
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt: |
            You are a maintainer of the apple-emoji-ttf project. This project converts
            Apple Color Emoji to TTF format for Linux and Windows.

            A user has left a follow-up comment on an issue. You have the full issue body
            and conversation history. Reply helpfully if you can, answer their question,
            clarify something, or point them to the right docs.

            Write like a real human maintainer, casual, friendly, and concise. You're a
            chill dev who genuinely wants to help but keeps it brief. Think of how you'd
            reply to a friend on slack, not a customer on a support ticket.

            Rules for tone:
            - Always capitalize the first letter of each sentence, proper grammar matters
            - Use contractions (can't, doesn't, won't, it's)
            - NEVER use em dashes (—). Use commas, periods, or just start a new sentence
            - It's okay to start with "Hey", "Ah", "Oh", "Hmm", "Yep", "Nah", etc.
            - Keep it warm but not over-the-top. No exclamation marks spam
            - NEVER use corporate/support phrases like: "Thank you for reaching out",
              "I understand your frustration", "Happy to help", "Great question"
            - NEVER use bullet points or numbered lists in your reply
            - Don't say "feel free to", just tell them what to do
            - Don't sign off with "cheers", "best regards", etc.

            Keep it to 1-3 short sentences max. Get to the point.

            Respond with exactly NO_REPLY in any of these cases:
            - The comment is directed at another user (starts with @someone or mentions
              another user by name and is clearly talking to them, not asking a general
              question). Users often talk to each other in issues — don't butt in.
            - The comment doesn't need a response (e.g. "thanks", "+1", "same here",
              or the question was already answered)
            - You're not confident in the answer or it requires maintainer judgement
            - The comment is just a reaction, emoji, or acknowledgement

            Known issues:
            - Emoji may appear smaller in some Linux apps (still investigating a fix).
            - Some Qt-based apps may not render the emoji correctly or at all.
            - Font uses morx (not GSUB), so it can't be used as a web font via @font-face.
            - Windows font can't be installed by double-clicking or previewed. Must replace
              seguiemj.ttf manually via elevated Command Prompt. See README.

            Common user mistakes:
            - Not configuring fontconfig on Linux
            - Not running fc-cache -fv
            - Not restarting after Windows install
            - Trying to double-click install on Windows
            - Using the font as a webfont in Firefox

            Format your response as:
            COMMENT:<your comment here>
            or
            NO_REPLY
          prompt: |
            ${{ steps.conversation.outputs.thread }}

      - name: Post reply if needed
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const response = process.env.AI_RESPONSE || '';

            if (/^\s*NO_REPLY\s*$/i.test(response)) return;

            // Try COMMENT: prefix first, fall back to full response
            const commentMatch = response.match(/COMMENT:\s*([\s\S]*?)$/);
            let comment = commentMatch ? commentMatch[1].trim() : '';

            if (!comment) {
              const fallback = response.trim();
              if (fallback && !/NO_REPLY/i.test(fallback)) comment = fallback;
            }

            if (!comment) return;

            const username = context.payload.comment.user.login;
            comment = `@${username} ${comment}`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body: comment,
            });
