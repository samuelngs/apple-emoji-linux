name: Build macOS fonts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    outputs:
      macos_version: ${{ steps.macos_version.outputs.macos_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set macOS version output
        id: macos_version
        run: echo "macos_version=$(sw_vers -productVersion | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Linux font
        run: python convert.py --target linux --output output/AppleColorEmoji-Linux.ttf

      - name: Build Windows font
        run: python convert.py --target windows --output output/AppleColorEmoji-Windows.ttf

      - name: Upload font artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: |
            output/AppleColorEmoji-Linux.ttf
            output/AppleColorEmoji-Windows.ttf

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Download font artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          name: fonts

      - name: Prepare release assets
        run: |
          from="${{ steps.download.outputs.download-path }}"
          find "$from" -name '*.ttf' -exec cp {} . \;

      - name: Build Debian package
        id: deb
        env:
          VERSION: "2.0.0+${{ steps.date.outputs.date }}.${{ steps.sha.outputs.short_sha }}"
        run: |
          mkdir -p deb-build
          cp -r distro/debian deb-build/debian
          cp AppleColorEmoji-Linux.ttf deb-build/AppleColorEmoji.ttf
          cp distro/debian/50-apple-color-emoji.conf deb-build/
          sed -i "s/(1.0.0)/(${VERSION})/" deb-build/debian/changelog
          docker run --rm -v "$PWD:/work" -w /work/deb-build ubuntu:latest bash -c \
            'apt-get update -qq && apt-get install -y -qq dpkg-dev debhelper && dpkg-buildpackage -b -uc -us'
          cp fonts-apple-color-emoji_*_all.deb fonts-apple-color-emoji.deb

      - name: Build Fedora RPM package
        id: rpm
        env:
          RPM_VERSION: "2.0.0"
          RPM_RELEASE: "0.${{ steps.date.outputs.date }}.${{ steps.sha.outputs.short_sha }}"
        run: |
          mkdir -p rpm-build/out
          cp AppleColorEmoji-Linux.ttf rpm-build/AppleColorEmoji.ttf
          cp distro/fedora/50-apple-color-emoji.conf distro/fedora/fonts-apple-color-emoji.spec rpm-build/
          sed -i "s/^Version:.*/Version: ${RPM_VERSION}/" rpm-build/fonts-apple-color-emoji.spec
          sed -i "s/^Release:.*/Release: ${RPM_RELEASE}%{?dist}/" rpm-build/fonts-apple-color-emoji.spec
          docker run --rm -v "$PWD/rpm-build:/work" -w /work fedora:latest bash -c \
            'dnf install -y -q rpm-build fontconfig && \
             rpmbuild -ba \
               --define "_sourcedir /work" \
               --define "_specdir /work" \
               --define "_builddir /work/build" \
               --define "_buildroot /work/buildroot" \
               --define "_rpmdir /work/out" \
               --define "_srcrpmdir /work/out" \
               /work/fonts-apple-color-emoji.spec'
          cp rpm-build/out/noarch/fonts-apple-color-emoji-*.noarch.rpm fonts-apple-color-emoji.rpm

      - name: Build AUR package
        id: aur
        env:
          # pkgver cannot contain hyphens; use dots (release tag stays macos-26-date-sha for GitHub)
          AUR_PKGVER: "2.0.0.${{ steps.date.outputs.date }}.${{ steps.sha.outputs.short_sha }}"
        run: |
          mkdir -p aur-build
          cp distro/aur/PKGBUILD distro/aur/75-apple-color-emoji.conf aur-build/
          cp AppleColorEmoji-Linux.ttf aur-build/
          cd aur-build
          sed -i "s|^pkgver=.*|pkgver=${AUR_PKGVER}|" PKGBUILD
          sed -i 's|"AppleColorEmoji-Linux.ttf::${url}/releases/download/${pkgver}/AppleColorEmoji-Linux.ttf"|"AppleColorEmoji-Linux.ttf"|' PKGBUILD
          docker run --rm -v "$PWD:/build" -w /build archlinux:latest bash -c \
            'pacman -Syu --noconfirm base-devel && useradd -m builder && chown -R builder:builder /build && su builder -c "cd /build && makepkg -sf --noconfirm"'
          cp ttf-apple-emoji-*.pkg.tar.zst ../ttf-apple-emoji.pkg.tar.zst
          cd ..

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-${{ needs.build.outputs.macos_version }}-${{ steps.date.outputs.date }}-${{ steps.sha.outputs.short_sha }}
          name: macOS ${{ needs.build.outputs.macos_version }} (${{ steps.date.outputs.date }}) [${{ steps.sha.outputs.short_sha }}]
          make_latest: true
          generate_release_notes: true
          files: |
            AppleColorEmoji-Linux.ttf
            AppleColorEmoji-Windows.ttf
            fonts-apple-color-emoji.deb
            fonts-apple-color-emoji.rpm
            ttf-apple-emoji.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
